services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source so Python file edits trigger uvicorn --reload.
      - ./backend:/app
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount source so Vite picks up edits immediately.
      - ./frontend:/app
      # Shield the image's node_modules from being overwritten by the host mount.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
